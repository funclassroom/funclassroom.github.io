name: local files

# The bundled games are plain files, so they can be tested without the open
# web: serve the repo and drive each one in Chromium. Fails if a game throws,
# draws nothing, or if the listing page loses a card.

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/games/**"
      - "files.html"
      - "assets/js/app.js"
      - "scripts/probe-files.mjs"
      - ".github/workflows/local-files.yml"

permissions:
  contents: read

concurrency:
  group: local-files
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.47.2 --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Serve the site
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Play every local file
        run: |
          sleep 2
          node scripts/probe-files.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-files-shots
          path: probe
          if-no-files-found: ignore
