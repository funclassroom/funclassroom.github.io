name: probe eagler

# One-off: load the Eaglercraft build in a real browser, direct and framed,
# and commit what happened. Delete this workflow once the answer is known.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-eagler.yml
      - scripts/probe-eagler.mjs

permissions:
  contents: write

concurrency:
  group: probe-eagler
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.47.2 --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Load it
        run: node scripts/probe-eagler.mjs
      - name: Commit what was seen
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -f probe
          git commit -m "Probe: Eaglercraft embed" || exit 0
          git pull --rebase --autostash
          git push
