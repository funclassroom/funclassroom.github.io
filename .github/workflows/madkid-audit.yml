name: Audit every MadKid embed
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check-madkid.mjs
      - .github/workflows/madkid-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node scripts/check-madkid.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madkid-browser-audit
          path: madkid-audit.json
