name: Refresh catalogue

# Runs on GitHub's runners because the dev sandbox cannot reach the portals.
# Pulls every portal in scripts/portals.py, groups duplicates by title, probes
# each embed for framing headers, and commits the result to this branch.

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/portals.py
      - scripts/build-catalog.py
      - .github/workflows/catalog.yml
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalogue
        run: |
          set -o pipefail
          python3 scripts/build-catalog.py --verify 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report
        if: always()
        run: |
          node -e '
            global.window = {};
            require("./assets/js/catalog.js");
            const c = window.CATALOG || [];
            const multi = c.filter((g) => g.sources.length > 1).length;
            const portals = {};
            c.forEach((g) => g.sources.forEach((s) => { portals[s.portal] = (portals[s.portal] || 0) + 1; }));
            console.log("tiles:", c.length, "| with fallback:", multi);
            console.log("sources per portal:", portals);
          '

      - name: Keep the build log on failure
        if: failure()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -f build.log
          git commit -q -m "Catalogue build log" || true
          git push || true

      - name: Commit if the catalogue changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add assets/js/catalog.js
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Refresh catalogue from the portal feeds"
          git push
