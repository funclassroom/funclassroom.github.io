name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node scripts/probe-frames.mjs
        continue-on-error: true
      - name: Save
        if: always()
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-*.png probe-frames.json scripts/probe-frames.mjs .github/workflows/probe.yml
          git commit -q -m "probe: frame behaviour in a real browser" || true
          git push || true
