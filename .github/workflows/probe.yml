name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe feed sizes
        run: |
          set +e
          exec > probe-out.txt 2>&1
          for n in 100 250 500 1000 2000; do
            printf "num=%s -> " "$n"
            curl -sS --max-time 90 "https://gamemonetize.com/feed.php?format=0&num=$n&page=1" -o /tmp/f.json
            wc -c < /tmp/f.json | tr -d '\n'; printf " bytes, "
            grep -o '"id":' /tmp/f.json | wc -l
            head -c 80 /tmp/f.json; echo
            sleep 20
          done
          printf "page2 of 100 -> "
          curl -sS --max-time 60 "https://gamemonetize.com/feed.php?format=0&num=100&page=2" | grep -o '"id":' | wc -l
          echo "=== done"
      - name: Save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.txt && git commit -q -m "probe feed sizes" && git push
