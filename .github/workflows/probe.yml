name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Look at the live wall
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const out = {};
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto("https://socks275.github.io/ClassroomGames/", { waitUntil: "networkidle", timeout: 90000 });
          await page.fill("#q", "geometry dash");
          await page.waitForTimeout(6000);
          out.tiles = await page.$$eval(".tile", (nodes) =>
            nodes.map((n) => {
              const img = n.querySelector("img");
              return {
                title: n.querySelector(".tile-title").textContent,
                hasImg: !!img,
                complete: img ? img.complete : null,
                w: img ? img.naturalWidth : 0,
                broken: n.querySelector(".tile-thumb").classList.contains("is-broken"),
              };
            })
          );
          await page.screenshot({ path: "probe-wall.png", fullPage: false });

          // click the plain one
          const plain = page.locator('.tile', { has: page.locator(".tile-title", { hasText: /^Geometry Dash$/ }) });
          out.foundPlain = (await plain.count()) > 0;
          if (out.foundPlain) {
            await plain.first().locator(".tile-open").click();
            await page.waitForTimeout(12000);
            out.player = await page.evaluate(() => ({
              blocked: !document.querySelector("[data-blocked]")?.hidden,
              src: document.querySelector("iframe")?.src,
              source: document.querySelector("[data-source]")?.textContent,
            }));
            await page.screenshot({ path: "probe-plain.png" });
          }
          await browser.close();
          fs.writeFileSync("probe-out.json", JSON.stringify(out, null, 1));
          JS
          node probe.mjs
      - name: Save
        if: always()
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.json probe-wall.png probe-plain.png .github/workflows/probe.yml
          git commit -q -m "probe: live wall in a real browser" || true
          git push || true
