name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Find the catalogue api and test framing
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const out = { json: [], framed: null };
          const browser = await chromium.launch();
          const p = await browser.newPage();
          p.on("response", async (r) => {
            const u = r.url();
            if (!/gamedistribution\.com/.test(u)) return;
            const ct = r.headers()["content-type"] || "";
            if (!/json/.test(ct)) return;
            let body = "";
            try { body = (await r.text()).slice(0, 400); } catch {}
            out.json.push({ url: u.slice(0, 200), status: r.status(), body });
          });
          await p.goto("https://gamedistribution.com/games/", { waitUntil: "networkidle", timeout: 90000 }).catch(()=>{});
          await p.mouse.wheel(0, 4000);
          await p.waitForTimeout(6000);
          out.count = await p.$$eval('a[href^="/games/"]', (a) => a.length);
          out.sample = await p.$$eval('a[href^="/games/"] img', (imgs) =>
            imgs.slice(0, 5).map((i) => ({ alt: i.alt, src: i.src }))
          );

          // framing test from a foreign origin
          const f = await browser.newPage();
          await f.setContent(`<body style="margin:0"><iframe src="https://html5.gamedistribution.com/f7be9dcb47e848178d99bffcaa396c68/" style="width:1000px;height:700px;border:0"></iframe></body>`);
          await f.waitForTimeout(9000);
          await f.screenshot({ path: "probe-gd.png" });
          const frames = f.frames().map((x) => x.url());
          out.framed = { frames: frames.slice(0, 5) };
          await browser.close();
          fs.writeFileSync("probe-out.json", JSON.stringify(out, null, 1));
          JS
          node probe.mjs
      - name: Save
        if: always()
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.json probe-gd.png .github/workflows/probe.yml
          git commit -q -m "probe: gamedistribution" || true
          git push || true
