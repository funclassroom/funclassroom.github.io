name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - run: |
          cat > p.mjs <<'JS'
          import { chromium } from "playwright";
          const urls = [
            ["gamepix", "https://www.gamepix.com/embed/subway-surfers"],
            ["gamesnacks2", "https://gamesnacks.com/embed/games/two-cars-2"],
            ["htmlgames-other", "https://cdn.htmlgames.com/HalloweenTreats/index.html"],
            ["htmlgames-edge", "https://cdn.htmlgames.com/MahjongLineConnect/index.html"],
          ];
          const b = await chromium.launch();
          for (const [name, url] of urls) {
            const page = await b.newPage({ viewport: { width: 900, height: 600 } });
            let status = null, err = null;
            page.on("response", (r) => { if (r.url() === url) status = status ?? r.status(); });
            page.on("requestfailed", (r) => { if (r.url() === url) err = r.failure()?.errorText; });
            await page.setContent(`<body style="margin:0"><iframe src="${url}" style="width:900px;height:560px;border:0"></iframe></body>`).catch(()=>{});
            await page.waitForTimeout(9000);
            let canvas = 0, text = "", subs = 0;
            for (const f of page.frames().filter((f) => f !== page.mainFrame())) {
              subs++;
              try {
                const i = await f.evaluate(() => ({ c: document.querySelectorAll("canvas").length, t: (document.body.innerText||"").trim().slice(0,80) }));
                canvas += i.c; text = text || i.t;
              } catch {}
            }
            console.log(`${name}\tstatus=${status}\terr=${err}\tsubs=${subs}\tcanvas=${canvas}\ttext=${JSON.stringify(text)}`);
            await page.close();
          }
          // how many games does the htmlgames index actually hold?
          const r = await fetch("https://www.htmlgames.com/rss/games.php?json");
          const body = await r.text();
          const m = body.match(/\[.*\]/s);
          const rows = m ? JSON.parse(m[0]) : [];
          const cdn = rows.filter((x) => (x.url||"").startsWith("https://cdn.htmlgames.com/"));
          console.log(`htmlgames index: ${rows.length} rows, ${cdn.length} direct cdn urls`);
          await b.close();
          JS
          node p.mjs | tee probe-out.txt
      - name: Save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.txt && git commit -q -m "probe hosts 2" && git push
