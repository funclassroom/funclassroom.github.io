name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - run: |
          cat > p.mjs <<'JS'
          import { chromium } from "playwright";
          const urls = [
            ["htmlgames-cdn", "https://cdn.htmlgames.com/Klondike/index.html"],
            ["gamesnacks", "https://gamesnacks.com/embed/games/blackjack"],
            ["silvergames", "https://www.silvergames.com/en/embed/2048"],
            ["y8-page", "https://www.y8.com/game/stick_war_legacy"],
            ["gameflare-embed2", "https://www.gameflare.com/embed/monopoly-online/"],
            ["gamedistribution", "https://html5.gamedistribution.com/f7be9dcb47e848178d99bffcaa396c68/"],
          ];
          const b = await chromium.launch();
          for (const [name, url] of urls) {
            const page = await b.newPage({ viewport: { width: 900, height: 600 } });
            let status = null, err = null;
            page.on("response", (r) => { if (r.url() === url) status = status ?? r.status(); });
            page.on("requestfailed", (r) => { if (r.url() === url) err = r.failure()?.errorText; });
            await page.setContent(`<body style="margin:0"><iframe src="${url}" style="width:900px;height:560px;border:0"></iframe></body>`).catch(()=>{});
            await page.waitForTimeout(9000);
            let canvas = 0, text = "", subs = 0;
            for (const f of page.frames().filter((f) => f !== page.mainFrame())) {
              subs++;
              try {
                const i = await f.evaluate(() => ({ c: document.querySelectorAll("canvas").length, t: (document.body.innerText||"").trim().slice(0,80) }));
                canvas += i.c; text = text || i.t;
              } catch {}
            }
            console.log(`${name}\tstatus=${status}\terr=${err}\tsubs=${subs}\tcanvas=${canvas}\ttext=${JSON.stringify(text)}`);
            await page.close();
          }
          await b.close();
          JS
          node p.mjs | tee probe-out.txt
      - name: Save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.txt && git commit -q -m "probe hosts" && git push
