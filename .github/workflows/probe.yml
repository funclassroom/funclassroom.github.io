name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Look for the real game url
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const out = {};
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ viewport: { width: 1100, height: 800 } });
          for (const [name, url] of [
            ["game", "https://www.madkidgames.com/game/subway-surfers"],
            ["full", "https://www.madkidgames.com/full/subway-surfers"],
          ]) {
            const page = await ctx.newPage();
            const reqs = [];
            page.on("request", (r) => {
              const u = r.url();
              if (/\.html|embed|gameframe|html5/i.test(u)) reqs.push(r.resourceType() + " " + u.slice(0, 180));
            });
            let status = null;
            page.on("response", (r) => {
              if (r.url().includes("madkidgames.com")) status = status || r.status();
            });
            await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 }).catch((e) => reqs.push("goto: " + e.message));
            await page.waitForTimeout(15000);
            const frames = page.frames().map((f) => f.url()).filter(Boolean);
            const body = await page.evaluate(() => document.body.innerText.slice(0, 300)).catch(() => "");
            await page.screenshot({ path: `probe-madkid-${name}.png` }).catch(() => {});
            out[name] = { status, frames: [...new Set(frames)].slice(0, 10), reqs: [...new Set(reqs)].slice(0, 25), body };
            await page.close();
          }
          await browser.close();
          fs.writeFileSync("probe-out.json", JSON.stringify(out, null, 1));
          JS
          node probe.mjs
      - name: Save
        if: always()
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.json probe-madkid-*.png .github/workflows/probe.yml
          git commit -q -m "probe: madkid embed urls" || true
          git push || true
