name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-out.txt 2>&1
          ID=ngvzpif8dvzq12mkj1iqrzsfy519tzu2
          hdr () { echo "=== $1"; curl -sS -o /dev/null -D - --max-time 20 -A "Mozilla/5.0" "$1" | grep -iE '^(HTTP/|x-frame-options|content-security-policy: .*frame-ancestors|location)' | head -4; }
          hdr "https://gamemonetize.com/gameshtml5.php?gmdidco=$ID/"
          hdr "https://html5.gamemonetize.co/$ID/index.html"
          echo "=== feed pagination ids"
          for p in 1 2 3 5 10 50; do
            printf "page %s: " "$p"
            curl -sS --max-time 20 "https://gamemonetize.com/feed.php?format=0&num=3&page=$p" | head -c 120; echo
          done
          echo "=== feed total"
          for n in 1 500 2000; do
            printf "num=%s count: " "$n"
            curl -sS --max-time 40 "https://gamemonetize.com/feed.php?format=0&num=$n" | grep -o '"id"' | wc -l
          done
          echo "=== sitemap sample"
          curl -sS --max-time 30 https://gamemonetize.com/sitemap.xml | head -c 600; echo
          echo "=== one game page"
          curl -sS --max-time 25 -A "Mozilla/5.0" "https://gamemonetize.com/airplane-racer-game" | grep -oiE 'html5\.gamemonetize\.[a-z]+/[a-z0-9]+/?' | sort -u | head -5
          echo "=== done"
      - name: Save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.txt && git commit -q -m "probe results" && git push
