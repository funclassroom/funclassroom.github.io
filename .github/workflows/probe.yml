name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y >/dev/null 2>&1; npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Probe
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const out = {};
          const browser = await chromium.launch();

          // 1) Gameflare: what does its player actually frame?
          {
            const p = await browser.newPage();
            const frames = [];
            p.on("request", (r) => { if (/\.gameflare\.com/.test(r.url())) frames.push(r.resourceType() + " " + r.url()); });
            await p.goto("https://www.gameflare.com/online-game/monopoly-online/", { waitUntil: "domcontentloaded", timeout: 60000 }).catch(()=>{});
            await p.waitForTimeout(9000);
            out.gameflare = {
              iframes: p.frames().map((f) => f.url()).filter(Boolean).slice(0, 8),
              reqs: [...new Set(frames)].filter((u) => /game|embed|html/i.test(u)).slice(0, 15),
            };
            await p.close();
          }

          // 2) Live site: do GameMonetize tiles render, and how long do they take?
          {
            const p = await browser.newPage({ viewport: { width: 1200, height: 800 } });
            const failures = [];
            p.on("requestfailed", (r) => failures.push(r.url().slice(0, 120) + " :: " + (r.failure()?.errorText || "")));
            await p.goto("https://socks275.github.io/ClassroomGames/?v=11", { waitUntil: "domcontentloaded", timeout: 90000 });
            await p.waitForTimeout(3000);
            const results = [];
            for (let i = 0; i < 6; i += 1) {
              const tile = p.locator('.tile[data-playable="1"]').nth(i);
              await tile.locator(".tile-open").click();
              const started = Date.now();
              await p.waitForTimeout(14000);
              const info = await p.evaluate(() => ({
                source: document.querySelector("[data-source]")?.textContent,
                blocked: !document.querySelector("[data-blocked]")?.hidden,
                loading: !document.querySelector("[data-loading]")?.hidden,
                src: document.querySelector("iframe")?.src,
                title: document.querySelector("[data-player-title]")?.textContent,
              }));
              await p.screenshot({ path: `probe-tile-${i}.png` });
              results.push({ ...info, ms: Date.now() - started });
              await p.keyboard.press("Escape");
              await p.waitForTimeout(500);
            }
            out.tiles = results;
            out.failures = [...new Set(failures)].slice(0, 15);
            await p.close();
          }
          await browser.close();
          fs.writeFileSync("probe-out.json", JSON.stringify(out, null, 1));
          JS
          node probe.mjs
      - name: Save
        if: always()
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f probe-out.json probe-tile-*.png .github/workflows/probe.yml
          git commit -q -m "probe: gm tiles + gameflare" || true
          git push || true
