name: selftest
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 --no-audit --no-fund >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - run: |
          cat > t.mjs <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const urls = [
            ["real", "https://html5.gamemonetize.co/m84en44qjczb1b5846pzll223s40kar7/"],
            ["fake", "https://html5.gamemonetize.co/zzzznotarealgameid000000000000000/"],
            ["real2", "https://html5.gamemonetize.co/0p5y06afads5khij0euogrel5j8d610v/"],
            ["fake2", "https://html5.gamemonetize.co/0000000000000000000000000000000x/"],
          ];
          for (const [name, url] of urls) {
            const page = await browser.newPage({ viewport: { width: 900, height: 600 } });
            let status = null, err = null;
            page.on("response", (r) => { if (r.url() === url) status = status ?? r.status(); });
            page.on("requestfailed", (r) => { if (r.url() === url) err = r.failure()?.errorText; });
            await page.setContent(`<body style="margin:0"><iframe src="${url}" style="width:900px;height:560px;border:0"></iframe></body>`);
            await page.waitForTimeout(8000);
            let canvas = 0, text = "";
            for (const f of page.frames().filter((f) => f !== page.mainFrame())) {
              try {
                const i = await f.evaluate(() => ({ c: document.querySelectorAll("canvas").length, t: (document.body.innerText||"").trim().slice(0,100) }));
                canvas += i.c; text = text || i.t;
              } catch {}
            }
            console.log(`${name}\tstatus=${status}\terr=${err}\tframes=${page.frames().length - 1}\tcanvas=${canvas}\ttext=${JSON.stringify(text.slice(0,60))}`);
            await page.close();
          }
          await browser.close();
          JS
          node t.mjs | tee selftest.txt
      - name: Save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -f selftest.txt && git commit -q -m "selftest" && git push
