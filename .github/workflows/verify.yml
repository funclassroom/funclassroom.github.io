name: verify
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build with a link check
        run: |
          set -o pipefail
          python3 scripts/build-catalog.py --verify 2>&1 | tee verify.log
          exit ${PIPESTATUS[0]}
      - name: Save
        if: always()
        run: |
          git config user.name verify && git config user.email verify@users.noreply.github.com
          git add -f verify.log assets/js/catalog.js
          git commit -q -m "Catalog: link check against every source" || true
          git push || true
