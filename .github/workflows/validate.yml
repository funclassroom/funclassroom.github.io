name: validate
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 3"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install locked dependencies
        run: npm ci
      - name: Run UI and catalogue regression tests
        run: npm test
      - run: npm i playwright@1.47.2 --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Load a spread of embeds
        env:
          SAMPLE: 1500
          LANES: 12
          WAIT: 6000
        run: node scripts/validate.mjs
      - name: Commit the findings
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/dead-sources.json
          git commit -m "Validate a sample of embeds in a real browser" || exit 0
          git pull --rebase --autostash
          git push
