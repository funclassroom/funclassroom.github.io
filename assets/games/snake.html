<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0c1210; color: #e9f6ee; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px 4px; }
  .k { opacity: .55; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .v { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 800; }
  .v.green { color: #86e08a; }
  .spacer { flex: 1; }
  .hint { opacity: .5; font-weight: 500; font-size: 12px; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 8px 14px 14px; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 14px; background: #08130e;
           box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
  .overlay {
    position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center;
    text-align: center; padding: 20px; background: rgba(5, 12, 8, .8);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 40px); letter-spacing: -.02em; }
  .overlay p { margin: 0; opacity: .75; font-weight: 500; }
  .overlay button {
    margin-top: 18px; border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer;
    font: inherit; font-weight: 800; letter-spacing: .01em; background: #86e08a; color: #06230f;
  }
  .overlay button:hover { background: #9bea9e; }
  .overlay button:active { transform: scale(.97); }
</style>
</head>
<body>
<header>
  <div><div class="k">Score</div><div class="v" data-score>0</div></div>
  <div><div class="k">Best</div><div class="v green" data-best>0</div></div>
  <div class="spacer"></div>
  <div class="hint">Arrows / WASD · swipe</div>
</header>
<div class="stage">
  <canvas id="game"></canvas>
  <div class="overlay" data-overlay>
    <div>
      <h1 data-title>Snake</h1>
      <p data-line>Eat the apples. Don't bite yourself.</p>
      <button type="button" data-go>Start</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var cv = document.getElementById("game");
  var ctx = cv.getContext("2d");
  var overlay = document.querySelector("[data-overlay]");
  var titleEl = document.querySelector("[data-title]");
  var lineEl = document.querySelector("[data-line]");
  var goBtn = document.querySelector("[data-go]");
  var scoreEl = document.querySelector("[data-score]");
  var bestEl = document.querySelector("[data-best]");

  var COLS = 20;
  var ROWS = 15;
  var BEST_KEY = "classroom.snake.best";

  var best = 0;
  try { best = Number(window.localStorage.getItem(BEST_KEY)) || 0; } catch (err) { best = 0; }
  bestEl.textContent = String(best);

  var snake, dir, queue, food, score, alive, running, acc, last, step;
  var cell = 20, ox = 0, oy = 0, dpr = 1, W = 0, H = 0;

  function reset() {
    snake = [{ x: 9, y: 7 }, { x: 8, y: 7 }, { x: 7, y: 7 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    alive = true;
    running = false;
    acc = 0;
    step = 145;
    placeFood();
    scoreEl.textContent = "0";
  }

  function placeFood() {
    var open = [];
    for (var y = 0; y < ROWS; y += 1) {
      for (var x = 0; x < COLS; x += 1) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) open.push({ x: x, y: y });
      }
    }
    food = open.length ? open[Math.floor(Math.random() * open.length)] : null;
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var box = cv.getBoundingClientRect();
    W = Math.max(160, box.width);
    H = Math.max(120, box.height);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cell = Math.floor(Math.min(W / COLS, H / ROWS));
    ox = Math.floor((W - cell * COLS) / 2);
    oy = Math.floor((H - cell * ROWS) / 2);
    draw();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // board
    ctx.fillStyle = "#0a1712";
    roundRect(ox - 6, oy - 6, cell * COLS + 12, cell * ROWS + 12, 14);
    ctx.fill();

    // grid
    ctx.strokeStyle = "rgba(134, 224, 138, .06)";
    ctx.lineWidth = 1;
    for (var c = 1; c < COLS; c += 1) {
      ctx.beginPath();
      ctx.moveTo(ox + c * cell + 0.5, oy);
      ctx.lineTo(ox + c * cell + 0.5, oy + ROWS * cell);
      ctx.stroke();
    }
    for (var r = 1; r < ROWS; r += 1) {
      ctx.beginPath();
      ctx.moveTo(ox, oy + r * cell + 0.5);
      ctx.lineTo(ox + COLS * cell, oy + r * cell + 0.5);
      ctx.stroke();
    }

    if (!snake) return;

    // apple
    if (food) {
      var fx = ox + food.x * cell + cell / 2;
      var fy = oy + food.y * cell + cell / 2;
      ctx.fillStyle = "#ff5d5d";
      ctx.beginPath();
      ctx.arc(fx, fy + cell * 0.04, cell * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#7ee787";
      ctx.beginPath();
      ctx.ellipse(fx + cell * 0.12, fy - cell * 0.3, cell * 0.16, cell * 0.08, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // snake
    for (var i = snake.length - 1; i >= 0; i -= 1) {
      var seg = snake[i];
      var pad = cell * 0.07;
      var shade = 1 - i / (snake.length + 4);
      ctx.fillStyle = i === 0 ? "#b8f5b9" : "rgba(134, 224, 138, " + (0.5 + shade * 0.5) + ")";
      roundRect(ox + seg.x * cell + pad, oy + seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
    }

    // eyes
    var head = snake[0];
    ctx.fillStyle = "#06230f";
    var hx = ox + head.x * cell;
    var hy = oy + head.y * cell;
    var e = cell * 0.16;
    var off = cell * 0.24;
    if (dir.x === 1 || dir.x === -1) {
      ctx.fillRect(hx + cell / 2 - e / 2 + dir.x * off * 0.6, hy + cell * 0.28, e, e);
      ctx.fillRect(hx + cell / 2 - e / 2 + dir.x * off * 0.6, hy + cell * 0.56, e, e);
    } else {
      ctx.fillRect(hx + cell * 0.28, hy + cell / 2 - e / 2 + dir.y * off * 0.6, e, e);
      ctx.fillRect(hx + cell * 0.56, hy + cell / 2 - e / 2 + dir.y * off * 0.6, e, e);
    }
  }

  function turn(nx, ny) {
    var base = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -base.x && ny === -base.y) return;
    if (nx === base.x && ny === base.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      die();
      return;
    }

    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      if (score > best) {
        best = score;
        bestEl.textContent = String(best);
        try { window.localStorage.setItem(BEST_KEY, String(best)); } catch (err) { /* ignore */ }
      }
      step = Math.max(70, 145 - score * 1.4);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    alive = false;
    running = false;
    titleEl.textContent = "Game over";
    lineEl.textContent = "You scored " + score + ".";
    goBtn.textContent = "Play again";
    overlay.hidden = false;
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(120, now - last);
    last = now;
    if (running && alive) {
      acc += dt;
      while (acc >= step) { acc -= step; tick(); if (!alive) break; }
    }
    draw();
  }

  function start() {
    reset();
    overlay.hidden = true;
    running = true;
    last = 0;
  }

  goBtn.addEventListener("click", start);

  document.addEventListener("keydown", function (event) {
    var key = event.key;
    if (key === "ArrowUp" || key === "w" || key === "W") { turn(0, -1); event.preventDefault(); }
    else if (key === "ArrowDown" || key === "s" || key === "S") { turn(0, 1); event.preventDefault(); }
    else if (key === "ArrowLeft" || key === "a" || key === "A") { turn(-1, 0); event.preventDefault(); }
    else if (key === "ArrowRight" || key === "d" || key === "D") { turn(1, 0); event.preventDefault(); }
    else if (key === " " || key === "Enter") {
      event.preventDefault();
      if (!running) start();
    }
  });

  var touch = null;
  cv.addEventListener("pointerdown", function (event) {
    touch = { x: event.clientX, y: event.clientY };
  });
  cv.addEventListener("pointerup", function (event) {
    if (!touch) return;
    var dx = event.clientX - touch.x;
    var dy = event.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
      if (!running) start();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { running = false; last = 0; }
    else if (alive && overlay.hidden) { running = true; last = 0; }
  });

  reset();
  resize();
  window.requestAnimationFrame(frame);
}());
</script>
</body>
</html>
