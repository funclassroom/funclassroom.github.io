<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pong</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0c; color: #f2f2f4; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 18px 6px; }
  .side { display: flex; align-items: baseline; gap: 8px; }
  .side .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
  .side .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .side.you .v { color: #7ef0b0; }
  .side.cpu .v { color: #ff8a8a; }
  .spacer { flex: 1; }
  .hint { opacity: .45; font-size: 12px; font-weight: 500; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 0 14px 14px; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 14px; background: #08080a;
           box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
  .overlay {
    position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center;
    text-align: center; padding: 20px; background: rgba(6, 6, 8, .82);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 40px); }
  .overlay p { margin: 0; opacity: .72; font-weight: 500; }
  .overlay button {
    margin-top: 18px; border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer;
    font: inherit; font-weight: 800; background: #7ef0b0; color: #04200f;
  }
</style>
</head>
<body>
<header>
  <div class="side you"><span class="k">You</span><span class="v" data-you>0</span></div>
  <div class="side cpu"><span class="k">CPU</span><span class="v" data-cpu>0</span></div>
  <div class="spacer"></div>
  <div class="hint">Move the mouse · ↑ ↓ · drag</div>
</header>
<div class="stage">
  <canvas id="game"></canvas>
  <div class="overlay" data-overlay>
    <div>
      <h1 data-title>Pong</h1>
      <p data-line>First to seven. The CPU does not get tired.</p>
      <button type="button" data-go>Start</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var cv = document.getElementById("game");
  var ctx = cv.getContext("2d");
  var overlay = document.querySelector("[data-overlay]");
  var titleEl = document.querySelector("[data-title]");
  var lineEl = document.querySelector("[data-line]");
  var go = document.querySelector("[data-go]");
  var youEl = document.querySelector("[data-you]");
  var cpuEl = document.querySelector("[data-cpu]");

  var W = 0, H = 0, dpr = 1;
  var you, cpu, ball, youScore, cpuScore, running, over, keys, targetY, last, serveTimer;

  function reset() {
    youScore = 0;
    cpuScore = 0;
    over = false;
    running = false;
    serveTimer = 0;
    you = { x: 0, y: 0, w: 10, h: 0 };
    cpu = { x: 0, y: 0, w: 10, h: 0 };
    ball = { x: 0, y: 0, r: 7, vx: 0, vy: 0 };
    keys = { up: false, down: false };
    targetY = null;
    layout();
    serve(1);
    paint();
  }

  function layout() {
    var pw = Math.max(8, Math.min(14, W * 0.012));
    var ph = Math.max(48, Math.min(96, H * 0.18));
    you.w = cpu.w = pw;
    you.h = cpu.h = ph;
    you.x = 18;
    cpu.x = W - 18 - pw;
    you.y = you.y ? Math.min(Math.max(0, you.y * (H / (you._h || H))), H - ph) : (H - ph) / 2;
    cpu.y = cpu.y ? Math.min(Math.max(0, cpu.y * (H / (cpu._h || H))), H - ph) : (H - ph) / 2;
    you._h = H;
    cpu._h = H;
    ball.r = Math.max(5, Math.min(9, W / 110));
    if (ball.x === 0) { ball.x = W / 2; ball.y = H / 2; }
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var box = cv.getBoundingClientRect();
    W = Math.max(260, box.width);
    H = Math.max(200, box.height);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    layout();
  }

  function serve(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    var angle = (Math.random() * 0.6 - 0.3);
    var speed = Math.max(320, W * 0.42);
    ball.vx = Math.cos(angle) * speed * direction;
    ball.vy = Math.sin(angle) * speed;
    serveTimer = 0.7;
  }

  function paint() {
    youEl.textContent = String(youScore);
    cpuEl.textContent = String(cpuScore);
  }

  function point(who) {
    if (who === "you") youScore += 1;
    else cpuScore += 1;
    paint();
    if (youScore >= 7 || cpuScore >= 7) {
      over = true;
      running = false;
      var win = youScore >= 7;
      titleEl.textContent = win ? "You win" : "CPU wins";
      lineEl.textContent = youScore + " – " + cpuScore + (win ? ". Not bad at all." : ". Again?");
      go.textContent = "Play again";
      overlay.hidden = false;
      return;
    }
    serve(who === "you" ? 1 : -1);
  }

  function update(dt) {
    if (serveTimer > 0) serveTimer -= dt;

    var speed = 620;
    if (keys.up) you.y -= speed * dt;
    if (keys.down) you.y += speed * dt;
    if (targetY !== null) {
      var diff = targetY - (you.y + you.h / 2);
      you.y += Math.max(-speed * dt, Math.min(speed * dt, diff));
    }
    you.y = Math.max(0, Math.min(H - you.h, you.y));

    // CPU tracks the ball, but only once it is coming its way, and with a
    // little error so it can be beaten.
    var cpuSpeed = Math.max(240, 380 + cpuScore * 8);
    var wants = H / 2;
    if (ball.vx > 0) wants = ball.y + (Math.random() - 0.5) * H * 0.06;
    var move = wants - (cpu.y + cpu.h / 2);
    cpu.y += Math.max(-cpuSpeed * dt, Math.min(cpuSpeed * dt, move));
    cpu.y = Math.max(0, Math.min(H - cpu.h, cpu.y));

    if (serveTimer > 0) return;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }

    // paddles
    function hit(paddle, isYou) {
      var near = ball.x + (isYou ? ball.r : -ball.r);
      if (near >= paddle.x && near <= paddle.x + paddle.w &&
          ball.y >= paddle.y - ball.r && ball.y <= paddle.y + paddle.h + ball.r) {
        var rel = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
        rel = Math.max(-1, Math.min(1, rel));
        var speedNow = Math.min(1000, Math.hypot(ball.vx, ball.vy) * 1.06);
        var angle = rel * 0.95;
        ball.vx = Math.cos(angle) * speedNow * (isYou ? 1 : -1);
        ball.vy = Math.sin(angle) * speedNow;
        ball.x = isYou ? paddle.x + paddle.w + ball.r + 1 : paddle.x - ball.r - 1;
        return true;
      }
      return false;
    }

    if (ball.vx < 0) hit(you, true);
    else hit(cpu, false);

    if (ball.x + ball.r < -10) point("cpu");
    else if (ball.x - ball.r > W + 10) point("you");
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // net
    ctx.strokeStyle = "rgba(255, 255, 255, .10)";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#7ef0b0";
    ctx.beginPath();
    ctx.roundRect(you.x, you.y, you.w, you.h, you.w / 2);
    ctx.fill();

    ctx.fillStyle = "#ff8a8a";
    ctx.beginPath();
    ctx.roundRect(cpu.x, cpu.y, cpu.w, cpu.h, cpu.w / 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(255, 255, 255, .55)";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    if (running) update(dt);
    if (you) draw();
  }

  function start() {
    if (over) reset();
    overlay.hidden = true;
    running = true;
    last = 0;
  }

  go.addEventListener("click", start);

  document.addEventListener("keydown", function (event) {
    if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") { keys.up = true; event.preventDefault(); }
    if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") { keys.down = true; event.preventDefault(); }
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      if (!running) start();
    }
  });
  document.addEventListener("keyup", function (event) {
    if (event.key === "ArrowUp" || event.key === "w" || event.key === "W") keys.up = false;
    if (event.key === "ArrowDown" || event.key === "s" || event.key === "S") keys.down = false;
  });

  function aim(event) {
    var box = cv.getBoundingClientRect();
    targetY = event.clientY - box.top;
  }

  cv.addEventListener("pointerdown", function (event) {
    if (!running) { start(); return; }
    targetY = event.clientY - cv.getBoundingClientRect().top;
  });
  cv.addEventListener("pointermove", function (event) {
    if (event.pointerType === "mouse" || event.buttons) {
      targetY = event.clientY - cv.getBoundingClientRect().top;
    }
  });
  cv.addEventListener("pointerleave", function () { targetY = null; });

  window.addEventListener("resize", resize);

  reset();
  resize();
  window.requestAnimationFrame(frame);
}());
</script>
</body>
</html>
