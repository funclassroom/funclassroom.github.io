<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Breakout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b14; color: #eef0ff; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px 4px; }
  .k { opacity: .5; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lives { display: flex; gap: 5px; align-self: center; }
  .life { width: 15px; height: 6px; border-radius: 3px; background: #7c8cff; }
  .life.off { background: #2a2c46; }
  .spacer { flex: 1; }
  .hint { opacity: .45; font-size: 12px; font-weight: 500; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 8px 14px 14px; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 14px; background: #07070f;
           box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
  .overlay {
    position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center;
    text-align: center; padding: 20px; background: rgba(5, 5, 12, .82);
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(24px, 6vw, 38px); }
  .overlay p { margin: 0; opacity: .72; font-weight: 500; }
  .overlay button {
    margin-top: 18px; border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer;
    font: inherit; font-weight: 800; background: #7c8cff; color: #080a1c;
  }
  .overlay button:hover { background: #93a0ff; }
</style>
</head>
<body>
<header>
  <div><div class="k">Score</div><div class="v" data-score>0</div></div>
  <div><div class="k">Lives</div><div class="lives" data-lives></div></div>
  <div class="spacer"></div>
  <div class="hint">Move with the mouse · ← → · drag</div>
</header>
<div class="stage">
  <canvas id="game"></canvas>
  <div class="overlay" data-overlay>
    <div>
      <h1 data-title>Breakout</h1>
      <p data-line>Clear every brick. Three misses and it's over.</p>
      <button type="button" data-go>Start</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var cv = document.getElementById("game");
  var ctx = cv.getContext("2d");
  var overlay = document.querySelector("[data-overlay]");
  var titleEl = document.querySelector("[data-title]");
  var lineEl = document.querySelector("[data-line]");
  var go = document.querySelector("[data-go]");
  var scoreEl = document.querySelector("[data-score]");
  var livesEl = document.querySelector("[data-lives]");

  var COLORS = ["#ff6b8b", "#ffb86b", "#ffe066", "#7ee0a8", "#7c8cff", "#c98bff"];
  var COLS = 9;
  var ROWS = 5;

  var W = 0, H = 0, dpr = 1;
  var paddle, ball, bricks, score, lives, level, running, over, won, keys, attached;
  var last = 0;

  function reset() {
    score = 0;
    lives = 3;
    level = 1;
    over = false;
    won = false;
    running = false;
    buildLevel();
    resetBall();
    paintChrome();
  }

  function buildLevel() {
    bricks = [];
    var gap = 6;
    var margin = 24;
    var top = 54;
    var bw = (W - margin * 2 - gap * (COLS - 1)) / COLS;
    var bh = Math.max(16, Math.min(26, H * 0.045));
    for (var r = 0; r < ROWS; r += 1) {
      for (var c = 0; c < COLS; c += 1) {
        bricks.push({
          x: margin + c * (bw + gap),
          y: top + r * (bh + gap),
          w: bw,
          h: bh,
          color: COLORS[r % COLORS.length],
          alive: true
        });
      }
    }
  }

  function paddleWidth() { return Math.max(80, W * 0.17); }

  function resetBall() {
    paddle = { w: paddleWidth(), h: 11, x: (W - paddleWidth()) / 2, y: H - 34, speed: 0 };
    attached = true;
    ball = { x: W / 2, y: paddle.y - 12, r: 7, vx: 0, vy: 0 };
  }

  function paintChrome() {
    scoreEl.textContent = String(score);
    livesEl.innerHTML = "";
    for (var i = 0; i < 3; i += 1) {
      var life = document.createElement("span");
      life.className = "life" + (i < lives ? "" : " off");
      livesEl.appendChild(life);
    }
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var box = cv.getBoundingClientRect();
    var oldW = W || box.width;
    var oldH = H || box.height;
    W = Math.max(240, box.width);
    H = Math.max(200, box.height);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    if (bricks) {
      var dx = W / oldW;
      var dy = H / oldH;
      bricks.forEach(function (b) { b.x *= dx; b.y *= dy; b.w *= dx; b.h *= dy; });
      paddle.w = paddleWidth();
      paddle.x = Math.min(Math.max(0, paddle.x * dx), W - paddle.w);
      paddle.y = H - 34;
      ball.x *= dx; ball.y *= dy;
      if (attached) ball.y = paddle.y - 12;
      ball.r = Math.max(5, Math.min(9, W / 90));
    }
  }

  function launch() {
    if (!running || !attached) return;
    attached = false;
    var angle = (-70 + Math.random() * 20) * Math.PI / 180;
    var speed = 330 + level * 26;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
  }

  function die() {
    lives -= 1;
    paintChrome();
    if (lives <= 0) {
      over = true;
      running = false;
      titleEl.textContent = "Game over";
      lineEl.textContent = "You scored " + score + ".";
      go.textContent = "Play again";
      overlay.hidden = false;
      return;
    }
    resetBall();
    resetBallPaddle();
    attached = true;
  }

  function resetBallPaddle() {
    paddle.x = (W - paddle.w) / 2;
    ball.x = W / 2;
    ball.y = paddle.y - 12;
  }

  function update(dt) {
    if (keys.left) paddle.x -= 620 * dt;
    if (keys.right) paddle.x += 620 * dt;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (attached) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 12;
      return;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // paddle
    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h + 6 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
      ball.y = paddle.y - ball.r;
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      hit = Math.max(-1, Math.min(1, hit));
      var speed = Math.hypot(ball.vx, ball.vy) * 1.015;
      speed = Math.min(speed, 760);
      var angle = hit * 1.05; // radians from straight up
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.cos(angle) * speed;
    }

    if (ball.y - ball.r > H) { die(); return; }

    for (var i = 0; i < bricks.length; i += 1) {
      var b = bricks[i];
      if (!b.alive) continue;
      var nearX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      var nearY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      var dx = ball.x - nearX;
      var dy = ball.y - nearY;
      if (dx * dx + dy * dy > ball.r * ball.r) continue;

      b.alive = false;
      score += 10 * level;
      paintChrome();

      var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
      var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (overlapX < overlapY) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;
      break;
    }

    if (!bricks.some(function (b) { return b.alive; })) {
      level += 1;
      buildLevel();
      resetBall();
      attached = true;
      titleEl.textContent = "Level " + level;
      lineEl.textContent = "Faster ball, fresh wall.";
      go.textContent = "Keep going";
      overlay.hidden = false;
      running = false;
      won = true;
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // backdrop glow
    var grad = ctx.createRadialGradient(W / 2, H * 0.1, 10, W / 2, H * 0.1, H * 0.9);
    grad.addColorStop(0, "rgba(124, 140, 255, .10)");
    grad.addColorStop(1, "rgba(124, 140, 255, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    bricks.forEach(function (b) {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      var r = Math.min(5, b.h / 2);
      ctx.moveTo(b.x + r, b.y);
      ctx.arcTo(b.x + b.w, b.y, b.x + b.w, b.y + b.h, r);
      ctx.arcTo(b.x + b.w, b.y + b.h, b.x, b.y + b.h, r);
      ctx.arcTo(b.x, b.y + b.h, b.x, b.y, r);
      ctx.arcTo(b.x, b.y, b.x + b.w, b.y, r);
      ctx.closePath();
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // paddle
    ctx.fillStyle = "#dfe4ff";
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();

    // ball
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(160, 180, 255, .9)";
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) update(dt);
    if (bricks) draw();
  }

  function start() {
    if (won) {
      won = false;
    } else if (over) {
      reset();
      buildLevel();
      resetBall();
      resetBallPaddle();
    }
    overlay.hidden = true;
    running = true;
    attached = true;
    last = 0;
  }

  go.addEventListener("click", start);

  var keys = { left: false, right: false };
  document.addEventListener("keydown", function (event) {
    if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") { keys.left = true; event.preventDefault(); }
    if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") { keys.right = true; event.preventDefault(); }
    if (event.key === " ") {
      event.preventDefault();
      if (!running && overlay.hidden === false) start();
      else launch();
    }
  });
  document.addEventListener("keyup", function (event) {
    if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") keys.left = false;
    if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") keys.right = false;
  });

  function aim(event) {
    var box = cv.getBoundingClientRect();
    var x = event.clientX - box.left;
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }

  cv.addEventListener("pointerdown", function (event) {
    aim(event);
    if (overlay.hidden === false) { start(); return; }
    launch();
  });
  cv.addEventListener("pointermove", function (event) {
    if (event.buttons || event.pointerType === "mouse") aim(event);
  });

  window.addEventListener("resize", resize);

  reset();
  resize();
  paintChrome();
  window.requestAnimationFrame(frame);
}());
</script>
</body>
</html>
