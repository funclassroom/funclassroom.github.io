<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101218; overflow: hidden;
    font-family: Roboto, system-ui, Arial, sans-serif; color: #e8eaf0; }
  #stage { position: fixed; inset: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .err { position: absolute; inset: 0; display: grid; place-content: center;
    gap: 10px; padding: 32px; text-align: center; }
  .err h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .err p { margin: 0; font-size: 13px; line-height: 1.6; color: #9aa2b5; max-width: 44ch; }
  .err code { background: #1f2330; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  #full { position: absolute; right: 10px; bottom: 10px; z-index: 5;
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #2a2f3d;
    background: rgba(23,26,35,.88); color: #e8eaf0; font-size: 13px; cursor: pointer;
    opacity: 0; transition: opacity .18s; }
  #stage:hover #full { opacity: 1; }
</style>
</head>
<body>
<div id="stage"><button id="full" type="button">Fullscreen</button></div>

<script>
/* ============================================================
   embed.html — drop one game into ANY page of yours.

   Usage from another site:
     <iframe src="https://<you>.github.io/Classroom/embed.html?game=slope"
             style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen>
     </iframe>

   ?game=<id>   an id from assets/js/games.js (or a browser-saved custom game)
   ?src=<url>   an explicit URL — MUST be on an allowed host below
   ?chrome=1    keep the fullscreen button visible at all times
   ============================================================ */
(function () {
  "use strict";

  // Only these hosts may be embedded via ?src=. Add your own domains here.
  var ALLOWED_HOSTS = [
    "www.madkidgames.com",
    "madkidgames.com"
  ];

  var stage = document.getElementById("stage");
  var params = new URLSearchParams(location.search);

  function fail(title, detail) {
    var d = document.createElement("div");
    d.className = "err";
    d.innerHTML = "<h1></h1><p></p>";
    d.querySelector("h1").textContent = title;
    d.querySelector("p").textContent = detail;
    stage.insertBefore(d, stage.firstChild);
  }

  function hostAllowed(url) {
    try {
      var h = new URL(url, location.href).hostname;
      return ALLOWED_HOSTS.indexOf(h) !== -1;
    } catch (e) { return false; }
  }

  function launch(url, title) {
    document.title = title || "Game";
    var f = document.createElement("iframe");
    f.src = url;
    f.title = title || "Game";
    f.allow = "autoplay; fullscreen; gamepad; accelerometer; gyroscope; clipboard-write";
    f.allowFullscreen = true;
    f.setAttribute("referrerpolicy", "no-referrer");
    stage.insertBefore(f, stage.firstChild);
  }

  function boot() {
    var explicit = params.get("src");
    if (explicit) {
      if (!hostAllowed(explicit)) {
        return fail("This host is not allowed to be embedded",
          "Add the domain to ALLOWED_HOSTS in embed.html. Blocked request: " + explicit);
      }
      return launch(explicit, params.get("title") || "Game");
    }

    var id = params.get("game");
    if (!id) {
      return fail("No game specified",
        "Use ?game=<id> for a catalogued game, or ?src=<url> for a direct link.");
    }

    var catalog = (window.GAME_CATALOG || []).slice();
    try {
      catalog = catalog.concat(JSON.parse(localStorage.getItem("mk.customGames.v1") || "[]"));
    } catch (e) {}

    var match = null;
    for (var i = 0; i < catalog.length; i++) if (catalog[i].id === id) { match = catalog[i]; break; }

    if (!match) {
      return fail("Unknown game id: " + id,
        "Valid ids come from assets/js/games.js. Examples: " +
        (window.GAME_CATALOG || []).slice(0, 3).map(function (g) { return g.id; }).join(", "));
    }
    launch(match.url, match.title);
  }

  document.getElementById("full").addEventListener("click", function () {
    var f = stage.querySelector("iframe");
    if (f && f.requestFullscreen) f.requestFullscreen();
  });
  if (params.get("chrome")) document.getElementById("full").style.opacity = "1";

  // games.js is loaded after this inline block in the page order below,
  // so boot() runs on DOMContentLoaded to guarantee the catalog exists.
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script src="assets/js/games.js"></script>
</body>
</html>
