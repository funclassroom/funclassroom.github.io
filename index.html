<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G@M£$</title>
<meta name="description" content="G@M£$ — 507 titles that play right in the page.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='800' text-anchor='middle' fill='%23ffffff'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<a class="skip" href="#grid">Skip to the list</a>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="./">G@M£$</a>

    <div class="search">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search titles" autocomplete="off" spellcheck="false" aria-label="Search titles">
      <button type="button" class="search-clear" data-search-clear hidden aria-label="Clear search">
        <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="bar-actions">
      <button type="button" class="btn" data-saved-toggle aria-pressed="false">
        <svg class="ico" aria-hidden="true"><use href="#i-star"/></svg>
        <span>Saved</span>
        <b data-saved-count>0</b>
      </button>
      <button type="button" class="btn btn-dark" data-shuffle>
        <svg class="ico" aria-hidden="true"><use href="#i-shuffle"/></svg>
        <span>Random</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <h1>All titles <span class="count" data-count>0</span><span class="shown" data-shown></span></h1>
    <div class="sorts" role="group" aria-label="Sort by">
      <button type="button" data-sort="hot" aria-pressed="true">Popular</button>
      <button type="button" data-sort="top" aria-pressed="false">Top rated</button>
      <button type="button" data-sort="az" aria-pressed="false">A–Z</button>
    </div>
  </div>

  <section class="recent" data-recent hidden aria-label="Recently played">
    <h2>Recently played</h2>
    <div class="recent-list" data-recent-list></div>
  </section>

  <section id="grid" class="grid" aria-label="Titles"></section>

  <p class="empty" data-empty hidden>
    No results for <b data-empty-q></b>.
    <button type="button" class="link" data-clear>Clear search</button>
  </p>
</main>

<footer class="foot">
  <p>G@M£$ <span class="sep">/</span> 507 titles, streamed from MadKidGames. Nothing is hosted here.</p>
</footer>

<div class="player" data-player hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="player-title">
  <div class="player-top">
    <button type="button" class="pbtn" data-close aria-label="Close">
      <svg class="ico" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
    <div class="player-meta">
      <b id="player-title" data-player-title></b>
      <span data-player-sub></span>
    </div>
    <div class="player-tools">
      <a class="pbtn" data-external target="_blank" rel="noopener" aria-label="Open in a new tab">
        <svg class="ico" aria-hidden="true"><use href="#i-external"/></svg>
      </a>
      <button type="button" class="pbtn" data-fs aria-label="Fullscreen" aria-pressed="false">
        <svg class="ico" aria-hidden="true"><use href="#i-expand"/></svg>
      </button>
    </div>
  </div>

  <div class="player-stage" data-stage>
    <div class="player-load" data-loading>
      <span class="spinner" aria-hidden="true"></span>
      <span data-loading-text>Loading</span>
      <a class="load-link" data-load-link target="_blank" rel="noopener" hidden>Open in a new tab</a>
    </div>
  </div>
</div>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/><path d="M16 21h5v-5M21 21l-6-6M8 3H3v5M3 3l6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
</svg>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
