<!-- ============================================================
     CLASSROOM MODE
     ============================================================ -->
<div id="mode-classroom" class="mode">
  <header class="gc-topbar">
    <button class="gc-iconbtn" data-action="drawer" aria-label="Open menu" title="Main menu">
      <svg class="icon"><use href="#i-menu"/></svg>
    </button>
    <a class="gc-brand" href="#" data-action="home" aria-label="Classroom home">
      <span class="gc-brand-mark"><svg class="icon"><use href="#i-school"/></svg></span>
      <span class="gc-brand-name">Classroom</span>
    </a>
    <span class="gc-topbar-divider" aria-hidden="true"></span>
    <div class="gc-spacer"></div>
    <button class="gc-iconbtn" data-action="toggle-mode" aria-label="Apps" title="Apps">
      <svg class="icon"><use href="#i-apps"/></svg>
    </button>
    <button class="gc-iconbtn" data-action="join" aria-label="Join class" title="Join class">
      <svg class="icon"><use href="#i-add"/></svg>
    </button>
    <button class="gc-avatar" data-action="account" aria-label="Google Account" title="Sam Carter">S</button>
  </header>

  <main id="gc-view" class="gc-view"></main>
</div>

<!-- ============================================================
     GAMES MODE
     ============================================================ -->
<div id="mode-games" class="mode" hidden>
  <header class="mk-topbar">
    <a class="mk-brand" href="#" data-action="games-home" aria-label="MadKid Games home">
      <span class="mk-brand-mark"><svg class="icon"><use href="#i-gamepad"/></svg></span>
      <span class="mk-brand-name">MadKid<b>Games</b></span>
    </a>

    <label class="mk-search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="mk-search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" aria-label="Search games">
      <kbd class="mk-slash">/</kbd>
    </label>

    <div class="mk-spacer"></div>

    <button class="mk-btn mk-btn-quiet" data-action="toggle-mode" title="Ctrl+Shift+K" aria-label="Switch to Classroom mode">
      <svg class="icon"><use href="#i-eye-off"/></svg>
      <span>Classroom mode</span>
    </button>
  </header>

  <main id="mk-view" class="mk-view"></main>
</div>

<!-- ============================================================
     PLAYER (shared by both skins — never remounted on switch)
     ============================================================ -->
<section id="player" class="player" hidden aria-live="polite"></section>

<!-- ============================================================
     DRAWER (Classroom)
     ============================================================ -->
<div id="drawer-scrim" class="scrim" hidden data-action="drawer-close">
  <aside class="gc-drawer" role="dialog" aria-label="Main menu">
    <div class="gc-drawer-head">
      <span class="gc-brand-mark"><svg class="icon"><use href="#i-school"/></svg></span>
      <strong>Classroom</strong>
    </div>
    <nav class="gc-drawer-nav">
      <button class="gc-drawer-item" data-action="home">
        <svg class="icon"><use href="#i-home"/></svg><span>Classes</span>
      </button>
      <button class="gc-drawer-item" data-action="calendar">
        <svg class="icon"><use href="#i-calendar"/></svg><span>Calendar</span>
      </button>
      <button class="gc-drawer-item" data-action="todo">
        <svg class="icon"><use href="#i-check"/></svg><span>To-do</span>
      </button>
    </nav>
    <div class="gc-drawer-foot">
      <button class="gc-drawer-item gc-drawer-games" data-action="toggle-mode">
        <svg class="icon"><use href="#i-gamepad"/></svg><span>Games view</span>
      </button>
      <p class="gc-drawer-note">Signed in as Sam Carter</p>
    </div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
